name: Release

# Push a tag like v1.1.0 (or v1.1.0-rc.1 for a release candidate). See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]
  # Re-publish the npm SDK for an existing tag (for example after fixing npm's trusted
  # publisher settings) without rebuilding or re-releasing anything else.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Provenance attestations need a public repository (or an organization plan); while the
# repository is private they are skipped and checksums are the integrity check.
env:
  ATTEST: ${{ !github.event.repository.private }}

jobs:
  prepare:
    name: Check tag and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
      dockerhub_namespace: ${{ steps.version.outputs.dockerhub_namespace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Version from tag
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase; account names often are not.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "dockerhub_namespace=${DOCKERHUB_NAMESPACE_VAR:-$owner}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DOCKERHUB_NAMESPACE_VAR: ${{ vars.DOCKERHUB_NAMESPACE }}
      - name: CHANGELOG.md has a section for this version
        run: bash .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Binaries (GoReleaser)
    if: github.event_name == 'push'
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Release notes from CHANGELOG.md
        run: bash .github/scripts/release-notes.sh "${{ needs.prepare.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.ATTEST == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    if: github.event_name == 'push'
    needs: [prepare, ci]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, dashboard]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/bridge-${{ matrix.image }}
      # Each architecture builds natively and is pushed by digest; the merge job tags them.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ needs.prepare.outputs.owner }}/bridge-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  images-merge:
    name: Publish ${{ matrix.image }} image
    if: github.event_name == 'push'
    needs: [prepare, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [api, dashboard]
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && 'true' || 'false' }}
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/bridge-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.DOCKERHUB != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set, so the image is published to GHCR only."
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB == 'true' && format('docker.io/{0}/bridge-{1}', needs.prepare.outputs.dockerhub_namespace, matrix.image) || '' }}
          # 1.2.3 and 1.2 always; latest only for releases that are not pre-releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
      - name: Create the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - id: digest
        name: Image digest
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:${{ needs.prepare.outputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - if: env.ATTEST == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  android:
    name: Android APKs
    if: github.event_name == 'push'
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SIGNING: ${{ secrets.BRIDGE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: android/gateway
    steps:
      - if: env.SIGNING != 'true'
        working-directory: .
        run: echo "::warning::BRIDGE_KEYSTORE_BASE64 is not set, so this release has no APKs. See docs/releasing.md."
      - if: env.SIGNING == 'true'
        uses: actions/checkout@v7
      - if: env.SIGNING == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - if: env.SIGNING == 'true'
        uses: gradle/actions/setup-gradle@v6
      - if: env.SIGNING == 'true'
        name: Signed release builds (foss + gms)
        env:
          BRIDGE_KEYSTORE_BASE64: ${{ secrets.BRIDGE_KEYSTORE_BASE64 }}
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}
          BRIDGE_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          export BRIDGE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$BRIDGE_KEYSTORE_BASE64" | base64 -d > "$BRIDGE_KEYSTORE_FILE"
          ./gradlew --no-configuration-cache assembleFossRelease assembleGmsRelease
          rm -f "$BRIDGE_KEYSTORE_FILE"
      - if: env.SIGNING == 'true'
        name: Verify signatures and collect APKs
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          mkdir -p "$GITHUB_WORKSPACE/dist-apk"
          for flavor in foss gms; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$apksigner" verify --verbose "$apk"
            cp "$apk" "$GITHUB_WORKSPACE/dist-apk/bridge-gateway-$VERSION-$flavor.apk"
          done
          cd "$GITHUB_WORKSPACE/dist-apk" && sha256sum -- *.apk > apk-checksums.txt
      # R8 mapping files turn obfuscated crash stack traces back into readable ones. They are
      # kept as a workflow artifact, not a public release asset, so the obfuscation stays useful;
      # download and archive them for every release (see docs/android/README.md).
      - if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping-${{ needs.prepare.outputs.version }}
          path: android/gateway/app/build/outputs/mapping/*Release/mapping.txt
          retention-days: 90
          if-no-files-found: error
      - if: env.SIGNING == 'true' && env.ATTEST == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-apk/*.apk
      - if: env.SIGNING == 'true'
        name: Attach to the release
        working-directory: dist-apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./* --clobber --repo "$GITHUB_REPOSITORY"

  # Set the repository variable NPM_PUBLISH=true once the package can be published:
  # trusted publishing configured on npmjs.com, or an NPM_TOKEN secret for the first release.
  npm:
    name: SDK on npm
    needs: [prepare, ci]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5 or newer
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile --filter "@kroszborg/bridge..."
      - name: Stamp the version
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i "s/^export const VERSION = '.*';/export const VERSION = '$VERSION';/" src/client.ts
      - run: pnpm build
      - name: Publish
        run: |
          if npm view "@kroszborg/bridge@$VERSION" version > /dev/null 2>&1; then
            echo "@kroszborg/bridge@$VERSION is already on npm."; exit 0
          fi
          # Workspace-only dev dependencies mean nothing outside this repository.
          npm pkg delete devDependencies
          # Provenance requires repository.url to match GitHub's spelling of the repository.
          npm pkg set repository.url="git+https://github.com/$GITHUB_REPOSITORY.git"
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=next; fi
          flags=(--access public --tag "$tag")
          if [ "$ATTEST" = true ]; then flags+=(--provenance); fi
          # Verbose, so a refused trusted-publishing (OIDC) exchange says why in the log.
          npm publish "${flags[@]}" --loglevel verbose

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [binaries, images-merge, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
