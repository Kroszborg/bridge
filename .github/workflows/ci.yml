name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the full suite before publishing anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
          POSTGRES_DB: bridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    env:
      BRIDGE_TEST_DATABASE_URL: postgres://bridge:bridge@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: sqlc output is up to date
        run: |
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 diff
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...

  web:
    name: Dashboard and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-types || (echo "Run 'pnpm api:generate' and commit the result." && exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  android:
    name: Android gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint and debug builds (foss + gms)
        run: ./gradlew --no-configuration-cache testFossDebugUnitTest testGmsDebugUnitTest lintFossDebug lintGmsDebug assembleFossDebug assembleGmsDebug
      - name: The foss build contains no Google proprietary code
        run: |
          unzip -q -o app/build/outputs/apk/foss/debug/app-foss-debug.apk 'classes*.dex' -d /tmp/foss
          if cat /tmp/foss/classes*.dex | grep -aq -e 'Lcom/google/firebase/' -e 'Lcom/google/android/gms/'; then
            echo "foss APK contains Firebase or Play services classes"; exit 1
          fi

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dashboard.Dockerfile
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
