name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your use case before the solution. Real use cases decide the roadmap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Bridge to do?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
