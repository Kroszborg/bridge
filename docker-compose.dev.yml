# Local development infrastructure. Bound to 127.0.0.1 only.
#   docker compose -f docker-compose.dev.yml up -d
name: bridge-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: bridge
      POSTGRES_DB: bridge
    ports:
      - "127.0.0.1:${BRIDGE_DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
